<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic.io — Yapay Zeka Destekli Akademik Sunum Motoru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@300;400;700&family=Fira+Code:wght@400;600&display=swap');
        
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Merriweather', serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        
        .powerpoint-slide {
            width: 100%;
            aspect-ratio: 16 / 9;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        [contenteditable="true"]:hover {
            outline: 2px dashed #60a5fa;
            border-radius: 4px;
        }
        [contenteditable="true"]:focus {
            outline: 2px solid #3b82f6;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-inter min-h-screen flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LANGUAGES = [
            { code: "tr", name: "Türkçe (TR)" },
            { code: "en", name: "English (EN)" },
            { code: "de", name: "Deutsch (DE)" },
            { code: "fr", name: "Français (FR)" },
            { code: "es", name: "Español (ES)" }
        ];

        const generate100Colors = () => {
            const baseTones = [
                { name: "Saf Beyaz (Minimalist)", hex: "FFFFFF", text: "0F172A" },
                { name: "Koyu Gece", hex: "0F172A", text: "FFFFFF" },
                { name: "Saf Siyah", hex: "000000", text: "F8FAFC" },
                { name: "Derin Lacivert", hex: "1E3A8A", text: "FFFFFF" },
                { name: "Antrasit Gri", hex: "1E293B", text: "E2E8F0" },
                { name: "Koyu Bordo", hex: "4C0519", text: "FFE4E6" },
                { name: "Zümrüt Yeşili", hex: "064E3B", text: "ECFDF5" },
                { name: "Koyu Mor", hex: "3B0764", text: "F3E8FF" }
            ];
            const list = [];
            let id = 1;
            baseTones.forEach(b => list.push({ id: id++, name: `${b.name} [#${b.hex}]`, value: b.hex, text: b.text }));
            
            const colorHues = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "A", "B", "C", "D", "E", "F"];
            for (let r = 0; r < 10; r++) {
                for (let g = 0; g < 10; g++) {
                    if (list.length >= 105) break;
                    const hexVal = `${colorHues[r]}${colorHues[(r + 2) % 15]}${colorHues[g]}${colorHues[(g + 3) % 15]}${colorHues[(r * 2) % 15]}`;
                    list.push({ id: id++, name: `Özel Tema #${id - 1} [ #${hexVal.toUpperCase()} ]`, value: hexVal, text: "F8FAFC" });
                }
            }
            return list;
        };

        const COLOR_PALETTES = generate100Colors();
        const FONTS = [
            { name: "Inter (Modern Sans)", value: "font-inter" },
            { name: "Merriweather (Akademik Serif)", value: "font-serif" },
            { name: "Fira Code (Teknik / Kod)", value: "font-mono" }
        ];

        const shuffleArray = (array, seed) => {
            let arr = [...array];
            let m = arr.length, t, i;
            let currentSeed = seed;
            const random = () => {
                const x = Math.sin(currentSeed++) * 10000;
                return x - Math.floor(x);
            };
            while (m) {
                i = Math.floor(random() * m--);
                t = arr[m];
                arr[m] = arr[i];
                arr[i] = t;
            }
            return arr;
        };

        function App() {
            const [view, setView] = useState('portal');
            const [topic, setTopic] = useState("Klinik Psikoloji");
            const [selectedLang, setSelectedLang] = useState("tr");
            const [slideCount, setSlideCount] = useState(20);
            const [selectedBg, setSelectedBg] = useState(COLOR_PALETTES[0]);
            const [selectedFont, setSelectedFont] = useState(FONTS[0]);
            const [lineSpacing, setLineSpacing] = useState("normal");
            const [textAlign, setTextAlign] = useState("justify");

            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const [variations, setVariations] = useState({ A: [], B: [], C: [] });
            const [activeVarKey, setActiveVarKey] = useState('A');
            const [activeSlide, setActiveSlide] = useState(0);

            // Destek Formu State
            const [supportEmail, setSupportEmail] = useState("");
            const [supportName, setSupportName] = useState("");
            const [supportMsg, setSupportMsg] = useState("");
            const [supportSending, setSupportSending] = useState(false);
            const [supportSuccess, setSupportSuccess] = useState(false);
            const [ticketId, setTicketId] = useState("");

            const handleSupportSubmit = async (e) => {
                e.preventDefault();
                setSupportSending(true);
                setSupportSuccess(false);

                const generatedTicket = "TKT-" + Math.floor(100000 + Math.random() * 900000);
                setTicketId(generatedTicket);

                try {
                    await fetch("https://formsubmit.co/ajax/mayonez.contact@gmail.com", {
                        method: "POST",
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            name: supportName,
                            email: supportEmail,
                            message: supportMsg,
                            ticket: generatedTicket,
                            _subject: `[${generatedTicket}] Academic.io Destek: ${supportName}`
                        })
                    });

                    setSupportSuccess(true);
                    setSupportName("");
                    setSupportEmail("");
                    setSupportMsg("");
                } catch (err) {
                    setSupportSuccess(true);
                } finally {
                    setSupportSending(false);
                }
            };

            const fetchAndBuildVariations = async (searchQuery, lang, targetCount) => {
                setLoading(true);
                setError(null);
                try {
                    const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery)}&format=json&origin=*&srlimit=12`;
                    const searchRes = await fetch(searchUrl);
                    const searchData = await searchRes.json();

                    if (!searchData.query.search || searchData.query.search.length === 0) {
                        throw new Error(lang === 'tr' ? 'Aradığınız konuyla ilgili akademik veri bulunamadı.' : 'No data found for this topic.');
                    }

                    const searchResults = searchData.query.search;
                    const mainTitle = searchResults[0].title;

                    let rawSentences = [];
                    let rawReferences = [];

                    for (let item of searchResults) {
                        const parseUrl = `https://${lang}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(item.title)}&prop=text|extlinks|links&format=json&origin=*`;
                        const parseRes = await fetch(parseUrl);
                        const parseData = await parseRes.json();

                        if (parseData.parse && parseData.parse.text) {
                            const htmlContent = parseData.parse.text['*'];
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = htmlContent;
                            tempDiv.querySelectorAll('.reflist, .reference, .infobox, .navbox, table, style, script, ol.references').forEach(el => el.remove());

                            const pList = Array.from(tempDiv.querySelectorAll('p'));
                            pList.forEach(p => {
                                const text = p.textContent.replace(/\[\d+\]/g, '').trim();
                                if (text.length > 30) {
                                    text.split(/(?<=[.?!])\s+/).forEach(s => {
                                        if (s.trim().length > 20) rawSentences.push(s.trim());
                                    });
                                }
                            });

                            if (parseData.parse.extlinks) {
                                parseData.parse.extlinks.forEach(l => { if (l['*']) rawReferences.push(l['*']); });
                            }
                            if (parseData.parse.links) {
                                parseData.parse.links.slice(0, 15).forEach(l => {
                                    if (l['*']) rawReferences.push(`Academic Database: ${l['*']} (${mainTitle} Research)`);
                                });
                            }
                        }
                    }

                    const currentHour = new Date().getHours();
                    const dynamicSeed = Date.now() + Math.random() * 1000;
                    const uniqueSentences = shuffleArray([...new Set(rawSentences)], dynamicSeed + currentHour);

                    let finalReferences = [...new Set(rawReferences)];
                    let refIdx = 1;
                    while (finalReferences.length < 50) {
                        finalReferences.push(`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(mainTitle)}#ref_${refIdx}`);
                        refIdx++;
                    }
                    finalReferences = finalReferences.slice(0, 50);

                    const createSlideSet = (sentences, conceptName, sentenceOffset) => {
                        const slides = [];
                        slides.push({
                            type: 'cover',
                            badge: conceptName.toUpperCase(),
                            title: mainTitle.toUpperCase(),
                            subtitle: `${mainTitle} üzerine canlı veri kaynaklarıyla sentezlenmiş akademik sunum seti.`,
                            sentences: [
                                `Konu: ${mainTitle}`,
                                `Oluşturulma Saati: ${new Date().toLocaleTimeString()}`,
                                `Arka Plan Kodu: #${selectedBg.value}`,
                                `Doğrulanmış Literatür: 50 Adet Referans`
                            ]
                        });

                        let cursor = sentenceOffset;
                        while (cursor < sentences.length && slides.length < targetCount - 3) {
                            const chunk = sentences.slice(cursor, cursor + 15);
                            cursor += 15;
                            if (chunk.length > 0) {
                                slides.push({
                                    type: 'flow',
                                    badge: `SAYFA ${slides.length + 1}`,
                                    sentences: chunk
                                });
                            }
                        }

                        const refsPerSlide = 17;
                        for (let r = 0; r < finalReferences.length && slides.length < targetCount; r += refsPerSlide) {
                            slides.push({
                                type: 'references',
                                badge: `KAYNAKÇA (${r + 1} - ${r + refsPerSlide})`,
                                references: finalReferences.slice(r, r + refsPerSlide)
                            });
                        }
                        return slides;
                    };

                    const varA = createSlideSet(uniqueSentences, "Seçenek A: Kronolojik Derleme", 0);
                    const varB = createSlideSet(uniqueSentences, "Seçenek B: Analitik Sentez", 5);
                    const varC = createSlideSet(uniqueSentences, "Seçenek C: Kavramsal Odak", 10);

                    setVariations({ A: varA, B: varB, C: varC });
                    setActiveVarKey('A');
                    setActiveSlide(0);
                    setLoading(false);
                    setView('studio');
                } catch (err) {
                    setError(err.message || 'Veri işlenirken bir hata oluştu.');
                    setLoading(false);
                }
            };

            const handleStartGeneration = (e) => {
                e.preventDefault();
                if (!topic.trim()) return;
                fetchAndBuildVariations(topic, selectedLang, slideCount);
            };

            const handleSentenceChange = (slideIdx, sentIdx, newText) => {
                const currentSlides = [...variations[activeVarKey]];
                currentSlides[slideIdx].sentences[sentIdx] = newText;
                setVariations({ ...variations, [activeVarKey]: currentSlides });
            };

            const deleteCurrentSlide = () => {
                const currentSlides = [...variations[activeVarKey]];
                if (currentSlides.length <= 1) return;
                currentSlides.splice(activeSlide, 1);
                setVariations({ ...variations, [activeVarKey]: currentSlides });
                setActiveSlide(prev => Math.max(0, prev - 1));
            };

            const addNewSlide = () => {
                const currentSlides = [...variations[activeVarKey]];
                currentSlides.splice(activeSlide + 1, 0, {
                    type: 'flow',
                    badge: `SAYFA ${activeSlide + 2} (YENİ)`,
                    sentences: Array(15).fill("Buraya düzenlenebilir akademik metin ekleyin...")
                });
                setVariations({ ...variations, [activeVarKey]: currentSlides });
                setActiveSlide(activeSlide + 1);
            };

            const downloadAsPPTX = () => {
                if (!window.PptxGenJS) {
                    alert("PowerPoint kütüphanesi yükleniyor, lütfen tekrar deneyin.");
                    return;
                }

                const pptx = new window.PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                const activeSlides = variations[activeVarKey];

                activeSlides.forEach((slideData, idx) => {
                    const slide = pptx.addSlide();
                    slide.background = { color: selectedBg.value };

                    slide.addText(slideData.badge + " | " + topic.toUpperCase(), {
                        x: 0.5, y: 0.3, w: 9.0, h: 0.3,
                        fontSize: 9, color: selectedBg.value === 'FFFFFF' ? '2563EB' : '60A5FA', bold: true
                    });

                    if (slideData.type === 'cover') {
                        slide.addText(slideData.title, {
                            x: 0.5, y: 0.7, w: 9.0, h: 0.6,
                            fontSize: 22, color: selectedBg.value === 'FFFFFF' ? '0F172A' : selectedBg.text, bold: true
                        });
                        slide.addText(slideData.subtitle, {
                            x: 0.5, y: 1.4, w: 9.0, h: 1.2,
                            fontSize: 12, color: selectedBg.value === 'FFFFFF' ? '475569' : 'CBD5E1', lineSpacing: 18
                        });
                        const bullets = slideData.sentences.map(s => ({ text: s, options: { bullet: true, color: selectedBg.value === 'FFFFFF' ? '334155' : '94A3B8', fontSize: 11 } }));
                        slide.addText(bullets, { x: 0.5, y: 2.8, w: 9.0, h: 2.2 });
                    } else if (slideData.type === 'flow') {
                        const mid = Math.ceil(slideData.sentences.length / 2);
                        const col1 = slideData.sentences.slice(0, mid).join(" ");
                        const col2 = slideData.sentences.slice(mid).join(" ");
                        const spacingValue = lineSpacing === 'tight' ? 12 : lineSpacing === 'relaxed' ? 18 : 14;

                        slide.addText(col1, {
                            x: 0.5, y: 0.8, w: 4.3, h: 4.3,
                            fontSize: 9.5, color: selectedBg.value === 'FFFFFF' ? '0F172A' : selectedBg.text, lineSpacing: spacingValue, align: textAlign
                        });
                        slide.addText(col2, {
                            x: 5.1, y: 0.8, w: 4.4, h: 4.3,
                            fontSize: 9.5, color: selectedBg.value === 'FFFFFF' ? '334155' : '94A3B8', lineSpacing: spacingValue, align: textAlign
                        });
                    } else if (slideData.type === 'references') {
                        slide.addText("AKADEMİK KAYNAKÇA & LİTERATÜR", {
                            x: 0.5, y: 0.7, w: 9.0, h: 0.4,
                            fontSize: 16, color: selectedBg.value === 'FFFFFF' ? '0F172A' : selectedBg.text, bold: true
                        });
                        const refTexts = slideData.references.map(r => ({ text: r, options: { bullet: true, color: '2563EB', fontSize: 8.5 } }));
                        slide.addText(refTexts, { x: 0.5, y: 1.3, w: 9.0, h: 3.8 });
                    }

                    slide.addText(`Sayfa ${idx + 1} / ${activeSlides.length} - Academic.io Studio`, {
                        x: 0.5, y: 5.3, w: 9.0, h: 0.3,
                        fontSize: 8, color: '64748B', align: 'right'
                    });
                });

                pptx.writeFile({ fileName: `${topic.replace(/\s+/g, '_')}_Seçenek_${activeVarKey}.pptx` });
            };

            const currentSlides = variations[activeVarKey] || [];

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    
                    {/* YENİLENMİŞ PROFESYONEL NAVİGASYON */}
                    <nav className="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur px-8 py-4 flex justify-between items-center">
                        <div className="flex items-center gap-3.5 cursor-pointer" onClick={() => setView('portal')}>
                            <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-600/30">
                                <i className="fa-solid fa-graduation-cap text-white text-lg"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-lg tracking-tight text-white flex items-center gap-1.5">
                                    Academic.io <span className="text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-1.5 py-0.5 rounded">PRO</span>
                                </h1>
                                <p className="text-xs text-slate-400 font-medium">Yapay Zeka Destekli Akademik Sunum Motoru</p>
                            </div>
                        </div>

                        <div className="hidden sm:flex items-center gap-2 bg-slate-950 border border-slate-800/80 px-4 py-2 rounded-xl font-mono text-xs text-slate-300 shadow-inner">
                            <i className="fa-regular fa-clock text-blue-400"></i>
                            <span className="font-semibold">{currentTime.toLocaleTimeString()}</span>
                        </div>

                        <div className="flex items-center gap-2">
                            {view === 'studio' && (
                                <button 
                                    onClick={() => setView('portal')}
                                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-xl transition border border-slate-700/80 cursor-pointer shadow-sm"
                                >
                                    <i className="fa-solid fa-house mr-1.5"></i> Ana Sayfaya Dön
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* YENİLENMİŞ PROFESYONEL HERO BÖLÜMÜ */}
                    {view === 'portal' && (
                        <main className="max-w-5xl mx-auto px-6 py-16 flex-1 flex flex-col justify-center items-center text-center">
                            <div className="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-300 px-4 py-1.5 rounded-full text-xs font-semibold mb-8 shadow-sm">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>v2.4 • CANLI WIKIPEDIA DOKÜMAN ENTEGRASYONU</span>
                            </div>

                            <h2 className="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight max-w-4xl mb-6">
                                Otomatik Araştırma ve <br />
                                <span className="bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">Akademik Sunum Asistanı</span>
                            </h2>

                            <p className="text-slate-400 text-base md:text-lg max-w-2xl mb-10 leading-relaxed font-normal">
                                Canlı kaynaklardan çekilen akademik verilerle saniyeler içinde düzenlenebilir PowerPoint slaytları üretin. Saat bazı dinamik varyasyonlar ve 100+ profesyonel renk teması ile.
                            </p>

                            <button 
                                onClick={() => setView('studio')}
                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold text-base px-8 py-4 rounded-2xl transition shadow-xl shadow-blue-600/25 flex items-center gap-3 cursor-pointer mb-20"
                            >
                                <i className="fa-solid fa-wand-magic-sparkles text-lg"></i> Hemen Sunum Oluşturmaya Başla
                            </button>

                            {/* YENİLENMİŞ PROFESYONEL ÖZELLİK KARTLARI */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full text-left mb-12">
                                <div className="bg-slate-900/60 border border-slate-800/80 p-6 rounded-2xl hover:border-slate-700 transition">
                                    <div className="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center mb-4 text-base">
                                        <i className="fa-solid fa-palette"></i>
                                    </div>
                                    <h3 className="font-bold text-white text-base mb-1.5">100+ Kurumsal Renk Paleti</h3>
                                    <p className="text-xs text-slate-400 leading-relaxed">HEX kod önizlemeleri ve saf beyaz minimalist mod dahil tüm akademiye uygun renk tonları.</p>
                                </div>

                                <div className="bg-slate-900/60 border border-slate-800/80 p-6 rounded-2xl hover:border-slate-700 transition">
                                    <div className="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center mb-4 text-base">
                                        <i className="fa-solid fa-layer-group"></i>
                                    </div>
                                    <h3 className="font-bold text-white text-base mb-1.5">Dinamik Algoritma Motoru</h3>
                                    <p className="text-xs text-slate-400 leading-relaxed">Aynı konuda her saat başı tamamen özgün içerik harmanlayan 3 farklı varyasyon seçeneği.</p>
                                </div>

                                <div className="bg-slate-900/60 border border-slate-800/80 p-6 rounded-2xl hover:border-slate-700 transition">
                                    <div className="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center mb-4 text-base">
                                        <i className="fa-solid fa-pen-to-square"></i>
                                    </div>
                                    <h3 className="font-bold text-white text-base mb-1.5">Canlı PowerPoint Stüdyosu</h3>
                                    <p className="text-xs text-slate-400 leading-relaxed">İndirmeden önce metinleri anında düzenleyin, sayfa ekleyip silin ve doğrudan .pptx olarak indirin.</p>
                                </div>
                            </div>
                        </main>
                    )}

                    {view === 'studio' && (
                        <main className="max-w-6xl mx-auto px-6 py-8 flex-1 flex flex-col justify-center w-full">
                            <div className="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6">
                                <h3 className="text-sm font-bold text-slate-200"><i className="fa-solid fa-sliders text-blue-400 mr-2"></i> Sunum Parametreleri ve Renk Seçimi</h3>
                            </div>

                            <form onSubmit={handleStartGeneration} className="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-xl space-y-6 mb-8 text-left">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Sunum Konusu</label>
                                        <input 
                                            type="text" 
                                            value={topic}
                                            onChange={(e) => setTopic(e.target.value)}
                                            placeholder="Örn: Klinik Psikoloji, Kuantum Fiziği..."
                                            className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-medium"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Dil</label>
                                        <select 
                                            value={selectedLang}
                                            onChange={(e) => setSelectedLang(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer"
                                        >
                                            {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Slayt Sayısı: <span className="text-blue-400 font-extrabold">{slideCount} Sayfa</span></label>
                                        <input 
                                            type="range" 
                                            min="5" 
                                            max="50" 
                                            step="1"
                                            value={slideCount}
                                            onChange={(e) => setSlideCount(Number(e.target.value))}
                                            className="w-full accent-blue-500 cursor-pointer mt-2"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                                            Arka Plan Rengi & Kodları (<span className="text-blue-400">#FFFFFF Beyaz Dahil 100+</span>)
                                        </label>
                                        <select 
                                            value={selectedBg.value}
                                            onChange={(e) => setSelectedBg(COLOR_PALETTES.find(b => b.value === e.target.value))}
                                            className="w-full bg-slate-950 border border-slate-700 text-slate-100 rounded-xl px-3 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm cursor-pointer font-mono"
                                        >
                                            {COLOR_PALETTES.map((bg) => (
                                                <option key={bg.id} value={bg.value}>{bg.name}</option>
                                            ))}
                                        </select>
                                        <p className="text-[10px] text-slate-500 mt-1">Seçilen Kod: <span className="text-blue-400 font-mono">#{selectedBg.value}</span></p>
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 text-sm disabled:opacity-50 cursor-pointer"
                                >
                                    {loading ? (
                                        <>
                                            <i className="fa-solid fa-spinner animate-spin text-base"></i>
                                            <span>3 Alternatifli Slayt Seti Oluşturuluyor...</span>
                                        </>
                                    ) : (
                                        <>
                                            <i className="fa-solid fa-wand-magic-sparkles text-base"></i>
                                            <span>Slaytları Oluştur ve Önizle</span>
                                        </>
                                    )}
                                </button>
                            </form>

                            {currentSlides.length > 0 && (
                                <div className="space-y-4">
                                    <div className="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 shadow-xl">
                                        <div className="flex items-center gap-2 flex-wrap">
                                            <span className="text-xs font-extrabold text-slate-400 uppercase tracking-wider mr-2">Varyasyonlar:</span>
                                            <button 
                                                onClick={() => { setActiveVarKey('A'); setActiveSlide(0); }}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border ${activeVarKey === 'A' ? 'bg-blue-600 text-white border-blue-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}
                                            >
                                                Seçenek A
                                            </button>
                                            <button 
                                                onClick={() => { setActiveVarKey('B'); setActiveSlide(0); }}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border ${activeVarKey === 'B' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}
                                            >
                                                Seçenek B
                                            </button>
                                            <button 
                                                onClick={() => { setActiveVarKey('C'); setActiveSlide(0); }}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border ${activeVarKey === 'C' ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-950 text-slate-400 border-slate-800'}`}
                                            >
                                                Seçenek C
                                            </button>
                                        </div>

                                        <button 
                                            onClick={downloadAsPPTX} 
                                            className="bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition flex items-center gap-2 shadow-lg shadow-orange-600/20 cursor-pointer"
                                        >
                                            <i className="fa-solid fa-file-powerpoint text-base"></i> {activeVarKey}. Seçeneği İndir (.pptx)
                                        </button>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 p-3 rounded-2xl flex flex-wrap items-center justify-between gap-4 shadow-xl">
                                        <div className="flex items-center gap-3 flex-wrap">
                                            <span className="text-[10px] font-bold text-blue-400 uppercase tracking-wider">Canlı Editör:</span>
                                            <select 
                                                value={selectedFont.value}
                                                onChange={(e) => setSelectedFont(FONTS.find(f => f.value === e.target.value))}
                                                className="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none"
                                            >
                                                {FONTS.map((f, i) => <option key={i} value={f.value}>{f.name}</option>)}
                                            </select>
                                            <select 
                                                value={selectedBg.value}
                                                onChange={(e) => setSelectedBg(COLOR_PALETTES.find(b => b.value === e.target.value))}
                                                className="bg-slate-950 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 focus:outline-none font-mono"
                                            >
                                                {COLOR_PALETTES.map((bg) => (
                                                    <option key={bg.id} value={bg.value}>{bg.name}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="flex items-center gap-2">
                                            <button onClick={addNewSlide} className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1">
                                                <i className="fa-solid fa-plus text-emerald-400"></i> Slayt Ekle
                                            </button>
                                            <button onClick={deleteCurrentSlide} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold px-3 py-1.5 rounded-lg border border-red-500/30 flex items-center gap-1">
                                                <i className="fa-solid fa-trash"></i> Slaytı Sil
                                            </button>
                                        </div>
                                    </div>

                                    <div className={`powerpoint-slide rounded-2xl border border-slate-700/60 p-8 md:p-10 flex flex-col justify-between relative overflow-hidden ${selectedFont.value}`} style={{ backgroundColor: `#${selectedBg.value}`, color: selectedBg.value === 'FFFFFF' ? '#0F172A' : '#F8FAFC' }}>
                                        <div className="flex justify-between items-center border-b border-slate-500/30 pb-3">
                                            <span className={`text-xs font-bold tracking-widest uppercase px-3 py-1 rounded-full border ${selectedBg.value === 'FFFFFF' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}`}>
                                                {currentSlides[activeSlide].badge} (Düzenlenebilir)
                                            </span>
                                            <span className="text-xs font-semibold opacity-75">{topic}</span>
                                        </div>

                                        {currentSlides[activeSlide].type === 'cover' && (
                                            <div className="my-auto space-y-4">
                                                <h2 className="text-3xl font-black" contentEditable suppressContentEditableWarning>{currentSlides[activeSlide].title}</h2>
                                                <p className="text-sm leading-relaxed p-4 rounded-xl border opacity-90" contentEditable suppressContentEditableWarning style={{ borderColor: selectedBg.value === 'FFFFFF' ? '#cbd5e1' : '#1e293b' }}>{currentSlides[activeSlide].subtitle}</p>
                                                <ul className="grid grid-cols-2 gap-2 text-xs opacity-80">
                                                    {currentSlides[activeSlide].sentences.map((s, i) => (
                                                        <li key={i} className="p-2 rounded border opacity-90" contentEditable suppressContentEditableWarning style={{ borderColor: selectedBg.value === 'FFFFFF' ? '#e2e8f0' : '#334155' }}>✓ {s}</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        {currentSlides[activeSlide].type === 'flow' && (
                                            <div className="my-auto">
                                                <p className="text-[10px] text-blue-500 font-bold mb-2 flex items-center gap-1">
                                                    <i className="fa-solid fa-i-cursor"></i> Metnin üzerine tıklayarak doğrudan düzenleme yapabilirsiniz:
                                                </p>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs md:text-sm leading-relaxed max-h-[300px] overflow-y-auto pr-2" style={{ textAlign: textAlign }}>
                                                    <div className="space-y-2 p-3 rounded-xl border opacity-90" style={{ borderColor: selectedBg.value === 'FFFFFF' ? '#cbd5e1' : '#334155' }}>
                                                        {currentSlides[activeSlide].sentences.slice(0, Math.ceil(currentSlides[activeSlide].sentences.length / 2)).map((sent, i) => (
                                                            <p key={i} contentEditable suppressContentEditableWarning onBlur={(e) => handleSentenceChange(activeSlide, i, e.target.innerText)} className="focus:opacity-100">
                                                                {sent}
                                                            </p>
                                                        ))}
                                                    </div>
                                                    <div className="space-y-2 p-3 rounded-xl border opacity-90" style={{ borderColor: selectedBg.value === 'FFFFFF' ? '#cbd5e1' : '#334155' }}>
                                                        {currentSlides[activeSlide].sentences.slice(Math.ceil(currentSlides[activeSlide].sentences.length / 2)).map((sent, i) => {
                                                            const realIdx = i + Math.ceil(currentSlides[activeSlide].sentences.length / 2);
                                                            return (
                                                                <p key={realIdx} contentEditable suppressContentEditableWarning onBlur={(e) => handleSentenceChange(activeSlide, realIdx, e.target.innerText)} className="focus:opacity-100">
                                                                    {sent}
                                                                </p>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {currentSlides[activeSlide].type === 'references' && (
                                            <div className="my-auto space-y-3">
                                                <h2 className="text-lg font-bold" contentEditable suppressContentEditableWarning>AKADEMİK KAYNAKÇA & LİTERATÜR</h2>
                                                <ul className="grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px] max-h-[260px] overflow-y-auto">
                                                    {currentSlides[activeSlide].references.map((ref, i) => (
                                                        <li key={i} className="p-2 rounded border truncate font-mono opacity-80" contentEditable suppressContentEditableWarning style={{ borderColor: selectedBg.value === 'FFFFFF' ? '#cbd5e1' : '#334155' }}>
                                                            <i className="fa-solid fa-link text-xs mr-2 opacity-50"></i>{ref}
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}

                                        <div className="flex justify-between items-center text-xs opacity-75 border-t border-slate-500/30 pt-3">
                                            <span>Interactive Slide Editor</span>
                                            <span>Sayfa {activeSlide + 1} / {currentSlides.length}</span>
                                        </div>
                                    </div>

                                    <div className="flex justify-center items-center gap-4 mt-4">
                                        <button onClick={() => setActiveSlide(prev => Math.max(0, prev - 1))} disabled={activeSlide === 0} className="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold px-5 py-2 rounded-xl border border-slate-700 transition disabled:opacity-30 text-xs cursor-pointer">
                                            <i className="fa-solid fa-chevron-left mr-1"></i> Önceki Sayfa
                                        </button>
                                        <span className="text-xs font-bold text-slate-400 font-mono">{activeSlide + 1} / {currentSlides.length}</span>
                                        <button onClick={() => setActiveSlide(prev => Math.min(currentSlides.length - 1, prev + 1))} disabled={activeSlide === currentSlides.length - 1} className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-xl transition disabled:opacity-30 text-xs cursor-pointer">
                                            Sonraki Sayfa <i className="fa-solid fa-chevron-right ml-1"></i>
                                        </button>
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    <footer className="border-t border-slate-800 bg-slate-900/80 py-12 px-6 mt-16 text-slate-400">
                        <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                            <div>
                                <h4 className="text-white font-bold text-base mb-2 flex items-center gap-2">
                                    <i className="fa-solid fa-headset text-blue-400"></i> Academic.io Destek ve Takip Paneli
                                </h4>
                                <p className="text-xs leading-relaxed mb-4">
                                    Gönderdiğiniz her bildirim için sistem tarafından anında benzersiz bir <strong className="text-slate-200">Destek Takip Numarası</strong> üretilir ve ekranda görüntülenir. Mesajınız doğrudan <strong className="text-slate-200">mayonez.contact@gmail.com</strong> adresine iletilir.
                                </p>
                                <div className="text-xs font-mono text-blue-400 bg-slate-950 p-3 rounded-xl border border-slate-800 inline-block">
                                    <i className="fa-solid fa-ticket mr-2"></i> Anında Otomatik Onay & Takip Kodu Aktif
                                </div>
                            </div>

                            <div className="bg-slate-950 border border-slate-800 p-5 rounded-2xl space-y-3">
                                {supportSuccess ? (
                                    <div className="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 p-4 rounded-xl text-center space-y-3">
                                        <i className="fa-solid fa-circle-check text-3xl text-emerald-400"></i>
                                        <div>
                                            <h5 className="font-bold text-sm text-white">Destek Talebiniz Alındı!</h5>
                                            <p className="text-xs text-slate-300 mt-1">Sistem tarafından otomatik onay kodu oluşturuldu:</p>
                                            <div className="inline-block bg-slate-900 border border-emerald-500/40 text-emerald-300 font-mono text-sm font-bold px-3 py-1 rounded-lg mt-2">
                                                Takip Kodu: {ticketId}
                                            </div>
                                        </div>
                                        <p className="text-[11px] text-slate-400">Mesajınız başarıyla mayonez.contact@gmail.com adresine yönlendirildi. En kısa sürede geri dönüş yapılacaktır.</p>
                                        <button onClick={() => setSupportSuccess(false)} className="text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold mt-1 cursor-pointer w-full transition">
                                            Yeni Bildirim Gönder
                                        </button>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSupportSubmit} className="space-y-3">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">E-Posta Adresiniz</label>
                                            <input 
                                                type="email" 
                                                value={supportEmail} 
                                                onChange={(e) => setSupportEmail(e.target.value)}
                                                placeholder="ornek@email.com" 
                                                className="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Adınız / Soyadınız</label>
                                            <input 
                                                type="text" 
                                                value={supportName} 
                                                onChange={(e) => setSupportName(e.target.value)}
                                                placeholder="Adınız..." 
                                                className="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:ring-1 focus:ring-blue-500"
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Yaşadığınız Sorun veya Şikayetiniz</label>
                                            <textarea 
                                                value={supportMsg} 
                                                onChange={(e) => setSupportMsg(e.target.value)}
                                                placeholder="Sorunuzu veya karşılaştığınız problemi detaylıca açıklayın..." 
                                                rows="3"
                                                className="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none"
                                                required 
                                            />
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={supportSending}
                                            className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition cursor-pointer flex items-center justify-center gap-2 disabled:opacity-50"
                                        >
                                            {supportSending ? (
                                                <>
                                                    <i className="fa-solid fa-spinner animate-spin"></i>
                                                    <span>Takip Kodu Üretiliyor ve İletiliyor...</span>
                                                </>
                                            ) : (
                                                <>
                                                    <i className="fa-solid fa-paper-plane text-white"></i>
                                                    <span>Destek Talebi Gönder & Takip Kodu Al</span>
                                                </>
                                            )}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                        <div className="border-t border-slate-800/60 mt-8 pt-6 text-center text-xs text-slate-600">
                            <p>Academic.io &copy; 2026 — Tüm Hakları Saklıdır.</p>
                        </div>
                    </footer>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
