    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LANGUAGES = [
            { code: "tr", name: "Türkçe (TR)" },
            { code: "en", name: "English (EN)" },
            { code: "de", name: "Deutsch (DE)" },

        const AESTHETIC_THEMES = [
            { id: 1, name: "🌸 Pudra & Lavanta (Soft Pastel)", bg: "FDF4FF", card: "FFFFFF", accent: "C026D3", secondary: "F3E8FF", text: "1E1B4B", pptBg: "FDF4FF", pptAccent: "C026D3" },
            { id: 2, name: "🌊 Okyanus Esintisi (Fresh Mint)", bg: "F0FDFA", card: "FFFFFF", accent: "0D9488", secondary: "CCFBF1", text: "134E4A", pptBg: "F0FDFA", pptAccent: "0D9488" },
            { id: 3, name: "🍑 Şeftali & Gün Batımı (Warm Peach)", bg: "FFF7ED", card: "FFFFFF", accent: "EA580C", secondary: "FFEDD5", text: "431407", pptBg: "FFF7ED", pptAccent: "EA580C" },
            { id: 4, name: "🦋 Gökyüzü & İndigo (Modern Editorial)", bg: "EEF2FF", card: "FFFFFF", accent: "4F46E5", secondary: "E0E7FF", text: "1E1B4B", pptBg: "EEF2FF", pptAccent: "4F46E5" },
            { id: 5, name: "🌿 Adaçayı & Krem (Botanical)", bg: "F7FEE7", card: "FFFFFF", accent: "4D7C0F", secondary: "ECFCCB", text: "1A2E05", pptBg: "F7FEE7", pptAccent: "4D7C0F" },
            { id: 6, name: "🤍 Minimalist İnci Beyazı", bg: "FFFFFF", card: "F8FAFC", accent: "2563EB", secondary: "EFF6FF", text: "0F172A", pptBg: "FFFFFF", pptAccent: "2563EB" }

        const FONTS = [

        // ASLA KIRILMAYAN, HER ZAMAN YÜKLENEN ESTETİK SVG İLLÜSTRASYON MOTORU
        const SlideArtwork = ({ variant, accentColor, topic }) => {

                            <circle cx="165" cy="65" r="48" fill="url(#grad1)" />

                            <circle cx="170" cy="145" r="18" fill="#ffffff" stroke={accentColor} strokeWidth="2.5" />
                            <path d="M164 145 L169 150 L177 140" fill="none" stroke={accentColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />

                    )}
                    {artIndex === 1 && (
                        <svg viewBox="0 0 240 200" className="w-full h-full max-h-48 drop-shadow-sm">
                            <rect x="30" y="30" width="180" height="140" rx="24" fill="#ffffff" fillOpacity="0.85" />

                    )}
                    {artIndex === 2 && (
                        <svg viewBox="0 0 240 200" className="w-full h-full max-h-48 drop-shadow-sm">
                            <circle cx="120" cy="100" r="65" fill={accentColor} fillOpacity="0.12" />
                            <circle cx="120" cy="100" r="42" fill="#ffffff" stroke={accentColor} strokeWidth="2.5" strokeDasharray="6 4" />
                            <circle cx="120" cy="40" r="14" fill={accentColor} />
                            <circle cx="175" cy="130" r="14" fill="#818cf8" />
                            <circle cx="65" cy="130" r="14" fill="#f472b6" />
                            <line x1="120" y1="54" x2="120" y2="82" stroke={accentColor} strokeWidth="2" />
                            <line x1="163" y1="122" x2="138" y2="108" stroke={accentColor} strokeWidth="2" />
                            <line x1="77" y1="122" x2="102" y2="108" stroke={accentColor} strokeWidth="2" />
                        </svg>
                    )}
                    {artIndex === 3 && (
                        <svg viewBox="0 0 240 200" className="w-full h-full max-h-48 drop-shadow-sm">
                            <rect x="45" y="110" width="26" height="55" rx="8" fill={accentColor} fillOpacity="0.35" />
                            <rect x="85" y="80" width="26" height="85" rx="8" fill={accentColor} fillOpacity="0.6" />
                            <rect x="125" y="50" width="26" height="115" rx="8" fill={accentColor} fillOpacity="0.85" />
                            <rect x="165" y="30" width="26" height="135" rx="8" fill={accentColor} />
                            <circle cx="178" cy="18" r="5" fill="#f59e0b" />
                        </svg>
                    )}
                    <span className="mt-2 text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full bg-white/90 shadow-sm truncate max-w-[90%]" style={{ color: accentColor }}>
                        ✦ {topic}
                    </span>
                </div>
            );
        };

        const BASE_DICT = {
            tagBadge: "ESTETİK STÜDYO",
            tagText: "ÖZEL SVG İLLÜSTRASYON & PASTEL TASARIM MOTORU AKTİF",
            title1: "Göz Alıcı & Estetik",
            title2: "Akademik Sunum Stüdyosu",
            desc: "Konunuzu yazın; yumuşak renk paletleri, kırılmayan özel vektör illüstrasyonlar ve akademik kaynaklarla saniyeler içinde cicili bicili sunumlar hazırlayın.",
            startBtn: "Hemen Estetik Sunum Oluştur",
            card1Title: "Özel SVG İllüstrasyonlar",
            card1Desc: "Her slayta özel üretilen, asla bozulmayan modern grafik ve diyagramlar.",
            card2Title: "Estetik Renk Paletleri",
            card2Desc: "Pudra, lavanta, mint yeşili ve şeftali tonlarında özenle seçilmiş sunum temaları.",
            card3Title: "Canlı Düzenleme & .PPTX",
            card3Desc: "Slayt metinlerine tıklayarak anında düzenleyin ve PowerPoint olarak indirin.",
            panelTitle: "Estetik Sunum Tasarım Paneli",
            panelSub: "Konu + Pastel Tema + Vektörel Görsel Motoru",
            topicLabel: "Sunum Konusu",
            topicPlaceholder: "Örn: Pozitif Psikoloji, Yapay Zeka Etiği, Sanat Tarihi...",
            langLabel: "Sunum Dili",
            slidesLabel: "Slayt Sayısı",
            colorLabel: "Estetik Tema Seçimi",
            genBtn: "Cicili Bicili Sunumu Üret ✨",
            genLoading: "İçerik Derleniyor ve Görseller Tasarlanıyor...",
            sets: "Tasarım Varyasyonu:",
            chronological: "Akışkan",
            analytical: "Analitik",
            conceptual: "Kavramsal",
            addSlide: "Sayfa Ekle",
            deleteSlide: "Sil",
            downloadBtn: ".PPTX İndir",
            prevPage: "Önceki",
            nextPage: "Sonraki",
            slidePos: "Slayt:",
            homeBtn: "Ana Sayfa",
            supportTitle: "Academic.io Destek ve İletişim",
            supportDesc: "Herhangi bir öneriniz veya talebiniz için bize doğrudan yazabilirsiniz.",
            supportEmail: "E-Posta Adresiniz",
            supportName: "Adınız / Soyadınız",
            supportMsg: "Mesajınız",
            supportBtn: "Gönder",
            supportSending: "Gönderiliyor...",
            supportSuccessTitle: "Mesajınız İletildi!",
            newTicket: "Yeni Mesaj",
            rights: "Academic.io © 2026 — Estetik Akademik Sunum Motoru"
        };

        const shuffleArray = (array, seed) => {
            let arr = [...array];
            let m = arr.length, t, i;
            let currentSeed = seed;
            const random = () => {
                const x = Math.sin(currentSeed++) * 10000;
                return x - Math.floor(x);
            };
            while (m) {
                i = Math.floor(random() * m--);
                t = arr[m];
                arr[m] = arr[i];
                arr[i] = t;
            }
            return arr;
        };

        function App() {
            const [view, setView] = useState('portal');
            const [topic, setTopic] = useState("Pozitif Psikoloji ve Mutluluk");
            const [selectedLang, setSelectedLang] = useState("tr");
            const [slideCount, setSlideCount] = useState(12);
            const [selectedTheme, setSelectedTheme] = useState(AESTHETIC_THEMES[0]);
            const [selectedFont, setSelectedFont] = useState(FONTS[0]);

            const [uiDict, setUiDict] = useState(BASE_DICT);
            const [translatingUi, setTranslatingUi] = useState(false);

            const translateTextWithGoogle = async (text, targetLang) => {
                if (!text || targetLang === 'tr') return text;
                try {
                    const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
                    const data = await res.json();
                    if (data && data[0]) return data[0].map(item => item[0]).join('');
                } catch (e) {}
                return text;
            };

            useEffect(() => {
                const updateUiLanguage = async () => {
                    if (selectedLang === 'tr') {
                        setUiDict(BASE_DICT);
                        return;
                    }
                    setTranslatingUi(true);
                    try {
                        const keys = Object.keys(BASE_DICT);
                        const translatedDict = {};
                        for (let k of keys) {
                            translatedDict[k] = await translateTextWithGoogle(BASE_DICT[k], selectedLang);
                        }
                        setUiDict(translatedDict);
                    } catch (e) {
                        setUiDict(BASE_DICT);
                    } finally {
                        setTranslatingUi(false);
                    }
                };
                updateUiLanguage();
            }, [selectedLang]);

            const t = uiDict;
            const [loading, setLoading] = useState(false);
            const [variations, setVariations] = useState({ A: [], B: [], C: [] });
            const [activeVarKey, setActiveVarKey] = useState('A');
            const [activeSlide, setActiveSlide] = useState(0);

            const [supportEmail, setSupportEmail] = useState("");
            const [supportName, setSupportName] = useState("");
            const [supportMsg, setSupportMsg] = useState("");
            const [supportSending, setSupportSending] = useState(false);
            const [supportSuccess, setSupportSuccess] = useState(false);
            const [ticketId, setTicketId] = useState("");

            const handleSupportSubmit = async (e) => {
                e.preventDefault();
                setSupportSending(true);
                const generatedTicket = "TKT-" + Math.floor(100000 + Math.random() * 900000);
                setTicketId(generatedTicket);
                try {
                    await fetch("https://formsubmit.co/ajax/mayonez.contact@gmail.com", {
                        method: "POST",
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify({ name: supportName, email: supportEmail, message: supportMsg, ticket: generatedTicket })
                    });
                } catch (err) {}
                setSupportSuccess(true);
                setSupportName(""); setSupportEmail(""); setSupportMsg("");
                setSupportSending(false);
            };

            const fetchAndBuildVariations = async (searchQuery, lang, targetCount) => {
                setLoading(true);
                try {
                    let translatedQuery = searchQuery;
                    if (lang !== 'tr') translatedQuery = await translateTextWithGoogle(searchQuery, lang);

                    const searchUrl = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(translatedQuery)}&format=json&origin=*&srlimit=10`;
                    const searchRes = await fetch(searchUrl);
                    const searchData = await searchRes.json();

                    let searchResults = searchData.query ? searchData.query.search : [];
                    let activeLangForWiki = lang;
                    if (searchResults.length === 0 && lang !== 'en') {
                        const fallbackUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(searchQuery)}&format=json&origin=*&srlimit=10`;
                        const fbRes = await fetch(fallbackUrl);
                        const fbData = await fbRes.json();
                        searchResults = fbData.query ? fbData.query.search : [];
                        activeLangForWiki = 'en';
                    }

                    const mainTitle = searchResults.length > 0 ? searchResults[0].title : searchQuery;
                    let displayTitle = mainTitle;
                    if (activeLangForWiki === 'en' && lang !== 'en') {
                        displayTitle = await translateTextWithGoogle(mainTitle, lang);
                    }

                    let rawSentences = [];
                    let rawReferences = [];

                    for (let item of searchResults.slice(0, 6)) {
                        const parseUrl = `https://${activeLangForWiki}.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(item.title)}&prop=text|extlinks&format=json&origin=*`;
                        const parseRes = await fetch(parseUrl);
                        const parseData = await parseRes.json();

                        if (parseData.parse && parseData.parse.text) {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = parseData.parse.text['*'];
                            tempDiv.querySelectorAll('.reflist, .reference, .infobox, .navbox, table, style, script, ol.references').forEach(el => el.remove());

                            const pList = Array.from(tempDiv.querySelectorAll('p'));
                            for (let p of pList) {
                                let text = p.textContent.replace(/\[\d+\]/g, '').trim();
                                if (text.length > 40) {
                                    if (activeLangForWiki === 'en' && lang !== 'en') {
                                        text = await translateTextWithGoogle(text, lang);
                                    }
                                    text.split(/(?<=[.?!])\s+/).forEach(s => {
                                        if (s.trim().length > 25 && s.trim().length < 260) rawSentences.push(s.trim());
                                    });
                                }
                            }
                            if (parseData.parse.extlinks) {
                                parseData.parse.extlinks.forEach(l => { if (l['*']) rawReferences.push(l['*']); });
                            }
                        }
                    }

                    if (rawSentences.length === 0) {
                        rawSentences = [
                            `${displayTitle}, çağdaş akademik araştırmalarda disiplinlerarası yaklaşımlarla ele alınan temel bir kavramdır.`,
                            `Kuramsal çerçeve incelendiğinde, hem bireysel hem de toplumsal düzeyde önemli bulgular ortaya çıkmaktadır.`,
                            `Modern literatür, bu alandaki uygulamaların sürdürülebilir ve insan odaklı olması gerektiğini vurgulamaktadır.`,
                            `Araştırma bulguları, kavramsal modellerin pratik hayata entegrasyonunun verimliliği artırdığını göstermektedir.`
                        ];
                    }

                    const uniqueSentences = shuffleArray([...new Set(rawSentences)], Date.now());
                    let finalReferences = [...new Set(rawReferences)].slice(0, 24);
                    if (finalReferences.length === 0) {
                        finalReferences = [`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(mainTitle)}`];
                    }

                    const createSlideSet = (sentences, conceptName, offset) => {
                        const slides = [];
                        slides.push({
                            type: 'cover',
                            badge: `✨ ${conceptName.toUpperCase()}`,
                            title: displayTitle,
                            subtitle: `${displayTitle} üzerine yapılandırılmış görsel ve akademik sunum dosyası.`,
                            artVariant: 0,
                            highlights: [
                                `Dil: ${LANGUAGES.find(l => l.code === lang)?.name}`,
                                `Tema: ${selectedTheme.name.split(' ')[1] || 'Estetik'}`,
                                `Kapsam: ${targetCount} Slayt`,
                                `Durum: Düzenlenebilir`
                            ]
                        });

                        let cursor = offset;
                        let pageNum = 1;
                        while (slides.length < targetCount - 1) {
                            const chunk = [];
                            for (let k = 0; k < 4; k++) {
                                chunk.push(sentences[(cursor + k) % sentences.length]);
                            }
                            cursor += 4;
                            slides.push({
                                type: 'flow',
                                badge: `BÖLÜM ${pageNum} • ${conceptName.toUpperCase()}`,
                                sectionTitle: `${displayTitle} — Temel Bulgular & Analiz #${pageNum}`,
                                sentences: chunk,
                                artVariant: pageNum
                            });
                            pageNum++;
                        }

                        slides.push({
                            type: 'references',
                            badge: '📚 KAYNAKÇA & İLERİ OKUMA',
                            references: finalReferences.slice(0, 10)
                        });
                        return slides;
                    };

                    setVariations({
                        A: createSlideSet(uniqueSentences, t.chronological, 0),
                        B: createSlideSet(uniqueSentences, t.analytical, 3),
                        C: createSlideSet(uniqueSentences, t.conceptual, 6)
                    });
                    setActiveVarKey('A');
                    setActiveSlide(0);
                    setView('studio');
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const handleStartGeneration = (e) => {
                e.preventDefault();
                if (!topic.trim()) return;
                fetchAndBuildVariations(topic, selectedLang, slideCount);
            };

            const handleSentenceChange = (slideIdx, sentIdx, newText) => {
                const currentSlides = [...variations[activeVarKey]];
                currentSlides[slideIdx].sentences[sentIdx] = newText;
                setVariations({ ...variations, [activeVarKey]: currentSlides });
            };

            const deleteCurrentSlide = () => {
                const currentSlides = [...variations[activeVarKey]];
                if (currentSlides.length <= 1) return;
                currentSlides.splice(activeSlide, 1);
                setVariations({ ...variations, [activeVarKey]: currentSlides });
                setActiveSlide(prev => Math.max(0, prev - 1));
            };

            const addNewSlide = () => {
                const currentSlides = [...variations[activeVarKey]];
                currentSlides.splice(activeSlide + 1, 0, {
                    type: 'flow',
                    badge: `YENİ SAYFA ✨`,
                    sectionTitle: `${topic} — Ek Notlar`,
                    sentences: [
                        "Buraya tıklayarak kendi özel notlarınızı ekleyebilirsiniz.",
                        "Her kutucuk canlı olarak düzenlenebilir yapıdadır.",
                        "Sağ taraftaki vektör illüstrasyon slaytınıza otomatik eşlik eder.",
                        "İndir butonuna bastığınızda bu sayfa da PowerPoint dosyasına dahil edilir."
                    ],
                    artVariant: activeSlide + 1
                });
                setVariations({ ...variations, [activeVarKey]: currentSlides });
                setActiveSlide(activeSlide + 1);
            };

            const downloadAsPPTX = () => {
                if (!window.PptxGenJS) return;
                const pptx = new window.PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                const activeSlides = variations[activeVarKey];
                activeSlides.forEach((slideData, idx) => {
                    const slide = pptx.addSlide();
                    slide.background = { color: selectedTheme.pptBg };

                    // Üst dekoratif şerit
                    slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.12, fill: { color: selectedTheme.pptAccent } });

                    slide.addText(slideData.badge, {
                        x: 0.6, y: 0.35, w: 8.8, h: 0.3,
                        fontSize: 10, color: selectedTheme.pptAccent, bold: true
                    });

                    if (slideData.type === 'cover') {
                        slide.addShape(pptx.ShapeType.roundRect, { x: 0.6, y: 0.9, w: 5.8, h: 3.8, fill: { color: "FFFFFF" }, line: { color: selectedTheme.pptAccent, width: 1 } });
                        slide.addText(slideData.title, {
                            x: 0.9, y: 1.2, w: 5.2, h: 1.2,
                            fontSize: 24, color: selectedTheme.text, bold: true
                        });

                                    <form onSubmit={handleSupportSubmit} className="space-y-2.5">
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="text" value={supportName} onChange={(e) => setSupportName(e.target.value)} placeholder={t.supportName} className="bg-white border border-slate-200 text-xs rounded-xl px-3 py-2" required />
                                            <input type="email" value={supportEmail} onChange={(e) => setSupportEmail(e.target.value)} placeholder={t.supportEmail} className="bg-white border border-slate-200 text-xs rounded-xl px-3 py-2" required />
                                        </div>
                                        <textarea value={supportMsg} onChange={(e) => setSupportMsg(e.target.value)} placeholder={t.supportMsg} rows="2" className="w-full bg-white border border-slate-200 text-xs rounded-xl p-2.5 resize-none" required />
                                        <button type="submit" disabled={supportSending} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl cursor-pointer">
                                            {supportSending ? t.supportSending : t.supportBtn}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                        <p className="text-center text-xs text-slate-400 mt-8">{t.rights}</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
