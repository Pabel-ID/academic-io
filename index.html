<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dual-Language Presentation Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.com">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .slide-card { aspect-ratio: 16 / 9; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const LANGUAGES = [
            { code: "tr", name: "Türkçe" },
            { code: "en", name: "English" },
            { code: "de", name: "Deutsch" },
            { code: "fr", name: "Français" },
            { code: "es", name: "Español" },
            { code: "it", name: "Italiano" },
            { code: "ru", name: "Русский" },
            { code: "zh", name: "中文" }
        ];
        function App() {
            const [topic, setTopic] = useState("Yapay Zeka ve Gelecek Projeksiyonları");
            return (
                <div className="p-8 max-w-4xl mx-auto">
                    <h1 className="text-3xl font-bold mb-4">AI Slayt Üretici</h1>
                    <p className="text-slate-400">Proje başarıyla yüklendi! Konu: {topic}</p>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
